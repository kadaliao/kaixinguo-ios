# The Xcode project is generated from this file: run `xcodegen` after
# changing it, or after adding or removing files.
name: Kaixinguo
options:
  bundleIdPrefix: com.kadaliao
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "14"
    DEVELOPMENT_TEAM: HMDAVG9B8J
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  KaixinguoKit:
    path: KaixinguoKit
targets:
  Kaixinguo:
    type: application
    platform: iOS
    sources:
      - path: Kaixinguo
      - path: Shared
    dependencies:
      - package: KaixinguoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.kaixinguo
        PRODUCT_NAME: Kaixinguo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Kaixinguo/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 开心果
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    info:
      path: Kaixinguo/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.kadaliao.kaixinguo
            CFBundleURLSchemes: [kaixinguo]
        # A signing service the viewer runs on the home network may be
        # plain http: the settings' check reaches it, and the system asks
        # before the app talks to the network nearby.
        #
        # Casting serves the episode over plain http on Wi-Fi too: AirPlay
        # has the Apple TV or the television fetch it from the app.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 投屏时让电视从这台设备取视频，以及连接你在局域网里部署的签名服务。
  # The Apple TV app: its own views, KaixinguoKit and Shared/ in common with
  # the iOS app. The same bundle ID makes it the same app on the App Store.
  KaixinguoTV:
    type: application
    platform: tvOS
    sources:
      - path: KaixinguoTV
      - path: Shared
    dependencies:
      - package: KaixinguoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.kaixinguo
        PRODUCT_NAME: KaixinguoTV
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: KaixinguoTV/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 开心果
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    info:
      path: KaixinguoTV/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        ITSAppUsesNonExemptEncryption: false
        # A signing service the viewer runs on the home network may be
        # plain http: the settings' check reaches it, and the system asks
        # before the app talks to the network nearby.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 连接你在局域网里部署的签名服务。
  KaixinguoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KaixinguoUITests
    dependencies:
      - target: Kaixinguo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.kaixinguo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kaixinguo
  KaixinguoTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: KaixinguoTVUITests
    dependencies:
      - target: KaixinguoTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.kaixinguo.tvuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KaixinguoTV
schemes:
  Kaixinguo:
    build:
      targets:
        Kaixinguo: all
    test:
      targets:
        - KaixinguoUITests
    run:
      config: Debug
    archive:
      config: Release
  KaixinguoTV:
    build:
      targets:
        KaixinguoTV: all
    test:
      targets:
        - KaixinguoTVUITests
    run:
      config: Debug
    archive:
      config: Release

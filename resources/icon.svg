<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The macOS app's icon, its tile grown to fill the square: iOS rounds the corners itself. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3E58F"/>
      <stop offset="1" stop-color="#5E9F3A"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#EBDDBF"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC24A"/>
      <stop offset="1" stop-color="#4E8F2C"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(-124.272 -124.272) scale(1.242718)">
    <!-- the nut's shadow on the tile -->
    <ellipse cx="528" cy="560" rx="228" ry="292" transform="rotate(-28 528 560)" fill="#2F5E1C" opacity="0.22"/>
    <!-- the shell, a little open -->
    <ellipse cx="512" cy="530" rx="228" ry="292" transform="rotate(-28 512 530)" fill="url(#shell)"/>
    <!-- the kernel: a play button -->
    <path transform="translate(-14 -16)" d="M452 418 L452 662 Q452 690 476 676 L668 562 Q690 548 668 534 L476 404 Q452 390 452 418 Z" fill="url(#kernel)"/>
  </g>
</svg>
